name: Deploy Laravel Backend G2000 (SSH)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: 164.132.85.222
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            REPO_SSH_URL="git@github-g2000:niangdev03/g2000-back.git"
            PARENT_DIR="/var/www/g2000"
            APP_DIR="$PARENT_DIR/backend"

            echo "🚀 Démarrage du déploiement..."

            sudo mkdir -p $PARENT_DIR
            sudo chown -R $USER:$USER $PARENT_DIR

            if [ -f "$APP_DIR/.env" ]; then
              echo "💾 Sauvegarde du fichier .env..."
              cp "$APP_DIR/.env" /tmp/.env.temp
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 Installation initiale dans $APP_DIR..."
              cd $PARENT_DIR
              rm -rf backend
              git clone $REPO_SSH_URL backend
            else
              echo "🔄 Mise à jour du dépôt existant..."
              cd $APP_DIR
              echo "📌 Commit AVANT mise à jour :"
              git log -1 --oneline
              git fetch origin main
              git reset --hard origin/main
              echo "📌 Commit actuellement déployé :"
              git log -1 --oneline

              echo "📌 Status Git :"
              git status

              echo "📌 Branche actuelle :"
              git branch --show-current
            fi

            cd $APP_DIR

            if [ -f "/tmp/.env.temp" ]; then
              echo "RESTORE: Récupération de l'ancien fichier .env"
              mv /tmp/.env.temp .env
            elif [ ! -f ".env" ] && [ -f ".env.example" ]; then
              echo "INIT: Création d'un nouveau .env"
              cp .env.example .env
              php artisan key:generate
            fi

            echo "📥 Installation Composer..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Migrations BDD..."
            php artisan migrate --force

            echo "🧹 Optimisation caches..."
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔒 Correction des permissions..."
            sudo chown -R www-data:www-data $APP_DIR
            sudo chmod -R 775 $APP_DIR/storage $APP_DIR/bootstrap/cache

            sudo systemctl reload php8.5-fpm

            echo "✅ Déploiement terminé avec succès !"
