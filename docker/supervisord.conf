[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Serveur WebSocket de la messagerie. Il reste en local dans le conteneur :
; c'est Nginx (docker/nginx.conf) qui l'expose sous /app et /apps.
[program:reverb]
command=php /var/www/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Tâches planifiées de routes/console.php (login-security:prune à 03:30,
; relances:rappel-echeances à 09:00)
[program:scheduler]
command=php /var/www/artisan schedule:work
directory=/var/www
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
