# Le conteneur écoute en HTTP derrière le Nginx de l'hôte, qui termine le HTTPS.
# Sans ces deux réglages, Laravel verrait toutes les requêtes en http et venant
# de la même IP (celle du pont Docker) : le blocage des IP suspectes
# (BlockSuspiciousIp) bloquerait alors tout le monde d'un coup.
map $http_x_forwarded_proto $forwarded_https {
    default '';
    https   on;
}

server {
    listen 80;
    client_max_body_size 12M;
    root /var/www/public;
    index index.php;

    # Le port n'est publié que sur 127.0.0.1 : seul le Nginx de l'hôte peut
    # nous joindre, on peut donc lui faire confiance pour l'IP du visiteur.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb (messagerie temps réel) : /app/{key} = WebSocket du navigateur,
    # /apps/{id}/events = publication des messages par Laravel.
    location ~ ^/apps?/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
