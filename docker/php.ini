; Les pièces jointes sont validées jusqu'à 5 Mo côté Laravel (max:5000) :
; les valeurs par défaut de PHP (2M) les refuseraient avant la validation.
upload_max_filesize = 10M
post_max_size = 12M
; Génération des PDF (dompdf)
memory_limit = 256M
expose_php = Off

opcache.enable = 1
; Le code ne change jamais dans un conteneur : inutile de relire les fichiers
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
